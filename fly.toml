app = "pocketstation-relay"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[http_service]
internal_port = 8080
force_https = true
min_machines_running = 1

[http_service.concurrency]
type = "connections"
hard_limit = 500
soft_limit = 400

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1
