app = "pocketstation-relay"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

# Non-sensitive runtime configuration.
# Secrets (POCKETSTATION_JWT_SECRET) are set via `fly secrets set`.
[env]
  PORT             = "8080"
  ICE_UDP_PORT     = "10000"
  ICE_TCP_PORT     = "8081"
  RELAY_PUBLIC_IPS = "auto"
  TURN_PUBLIC_IP   = "auto"
  TURN_UDP_PORT    = "3478"
  TURN_TCP_PORT    = "3478"
  TURN_RELAY_MIN_PORT = "49160"
  TURN_RELAY_MAX_PORT = "49167"
  TURN_REALM       = "pocketstation.io"
  RELAY_AUTHORITY_MODE = "control-plane"
  RELAY_API_SERVER_URL = "https://pocketstation-api.fly.dev"
  PUBLIC_RELAY_URL = "https://pocketstation-relay.fly.dev"
  PUBLIC_RECEIVER_URL = "https://pocketstation-receiver.fly.dev"
  CONTROL_RECONCILE_INTERVAL_SEC = "5"
  RELAY_MAX_ROOMS = "3"
  RELAY_MAX_SUBSCRIBERS_PER_SESSION = "2"
  RELAY_MAX_BUSES_PER_SESSION = "4"
  RELAY_MAX_CONCURRENT_HANDSHAKES = "8"
  RELAY_MAX_INVITATIONS = "12"
  MAX_ROOMS_PER_IP_PER_MINUTE = "2"
  ROOM_EXPIRY_MINUTES = "15"
  SOURCE_RECONNECT_WINDOW_SEC = "30"
  ALLOWED_ORIGINS = "https://pocketstation-receiver.fly.dev"

# Signaling + control plane (WebSocket + HTTP)
[http_service]
internal_port = 8080
force_https = true
min_machines_running = 1
auto_start_machines = true
auto_stop_machines = "off"

[http_service.concurrency]
type = "connections"
hard_limit = 500
soft_limit = 400

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "15s"
  method = "GET"
  path = "/healthz"

# ICE-TCP media plane — single multiplexed TCP port for all WebRTC peers.
# Clients behind NAT use this when direct UDP to the relay is blocked.
# Port 8081 internal → port 8081 external (passthrough).
[[services]]
internal_port = 8081
protocol = "tcp"

  [[services.ports]]
  port = 8081

# ICE-UDP media plane — single multiplexed UDP port for all WebRTC peers.
# Direct UDP media path; lower latency than ICE-TCP.
[[services]]
internal_port = 10000
protocol = "udp"

  [[services.ports]]
  port = 10000

# TURN/STUN UDP — standard port for discovery and allocation requests.
[[services]]
internal_port = 3478
protocol = "udp"

  [[services.ports]]
  port = 3478

# TURN media allocations use a finite range on the app's dedicated IPv4.
# Each public UDP port maps to the same port inside the Relay machine.
[[services]]
internal_port = 49160
protocol = "udp"
  [[services.ports]]
  port = 49160

[[services]]
internal_port = 49161
protocol = "udp"
  [[services.ports]]
  port = 49161

[[services]]
internal_port = 49162
protocol = "udp"
  [[services.ports]]
  port = 49162

[[services]]
internal_port = 49163
protocol = "udp"
  [[services.ports]]
  port = 49163

[[services]]
internal_port = 49164
protocol = "udp"
  [[services.ports]]
  port = 49164

[[services]]
internal_port = 49165
protocol = "udp"
  [[services.ports]]
  port = 49165

[[services]]
internal_port = 49166
protocol = "udp"
  [[services.ports]]
  port = 49166

[[services]]
internal_port = 49167
protocol = "udp"
  [[services.ports]]
  port = 49167

# TURN/TCP — TURN over plain TCP for clients where UDP:3478 is filtered.
[[services]]
internal_port = 3478
protocol = "tcp"

  [[services.ports]]
  port = 3478

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1
