name: deploy

on:
  workflow_run:
    workflows: [ci-go]
    branches:
      - main
    types: [completed]

permissions:
  contents: read

concurrency:
  group: relay-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify required production secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_names="$(flyctl secrets list --app pocketstation-relay --json | jq -r '.[] | .name // .Name')"
          missing=0
          for name in POCKETSTATION_JWT_SECRET POCKETSTATION_INTERNAL_SECRET TURN_SHARED_SECRET; do
            if ! grep -qx "$name" <<<"$secret_names"; then
              echo "::error::Fly app pocketstation-relay is missing required secret $name"
              missing=1
            fi
          done
          exit "$missing"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy relay to Fly.io
        run: >-
          flyctl deploy --remote-only
          --build-arg GIT_SHA=${{ github.event.workflow_run.head_sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
