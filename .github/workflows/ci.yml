name: ci-go
on: [pull_request, push]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: gofmt check
        run: |
          BAD=$(gofmt -l .)
          if [ -n "$BAD" ]; then echo "needs gofmt:"; echo "$BAD"; exit 1; fi
      - run: go test -short ./...
      - run: go vet ./...
      - run: go test -race -short ./...

  shutdown:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - run: go test -race -timeout 60s -run TestGiven_RelayShutdown ./internal/server/

  integration:
    # Runs only tests that do not require real Pion ICE (loopback ICE is
    # unreliable in GitHub Actions containers). Pion ICE tests are covered
    # locally and in the local soak run. Cross-service JWT tests need no ICE.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - run: go test -race -timeout 2m -run "TestGiven_ApiServerToken" ./test/integration/

  smoke:
    # P5-PROD-004: binary subprocess smoke test.
    # Builds fake-source and relay-server binaries; starts relay-server in the
    # background; runs fake-source against it for 3 seconds; verifies clean exit.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Build binaries
        run: go build ./cmd/relay-server ./cmd/fake-source
      - name: Smoke test — fake-source against live relay
        run: |
          POCKETSTATION_JWT_SECRET=smoke-secret ./relay-server &
          RELAY_PID=$!
          sleep 1
          # fake-source connects, publishes for 3 seconds, exits 0
          timeout 10s ./fake-source --relay http://localhost:8080 --duration 3s
          STATUS=$?
          kill $RELAY_PID 2>/dev/null || true
          exit $STATUS

  soak:
    # Soak test requires Pion ICE loopback which is unreliable in GitHub Actions
    # containers. Run locally: go test -race -timeout 10m ./test/soak/
    # This job verifies the soak package compiles and Short()-guarded fast path
    # runs; full 5-minute soak is a local/nightly manual check.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - run: go test -short -timeout 30s ./test/soak/
