name: ci-go
on: [pull_request, push]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: test -z "$(gofmt -l .)"
      - run: go test -short ./...
      - run: go vet ./...
      - run: go test -race -short ./...

  soak:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test -race -timeout 10m -run TestSoak ./test/soak/
