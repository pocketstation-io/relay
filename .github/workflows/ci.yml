name: ci-go
on: [pull_request, push]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: gofmt check
        run: |
          BAD=$(gofmt -l .)
          if [ -n "$BAD" ]; then echo "needs gofmt:"; echo "$BAD"; exit 1; fi
      - run: go test -short ./...
      - run: go vet ./...
      - run: go test -race -short ./...

  shutdown:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - run: go test -race -timeout 60s -run TestGiven_RelayShutdown ./internal/server/

  integration:
    # Runs only tests that do not require real Pion ICE (loopback ICE is
    # unreliable in GitHub Actions containers). Pion ICE tests are covered
    # locally and in the local soak run. Cross-service JWT tests need no ICE.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - run: go test -race -timeout 2m -run "TestGiven_ApiServerToken" ./test/integration/

  soak:
    # Soak test requires Pion ICE loopback which is unreliable in GitHub Actions
    # containers. Run locally: go test -race -timeout 10m ./test/soak/
    # This job verifies the soak package compiles and Short()-guarded fast path
    # runs; full 5-minute soak is a local/nightly manual check.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - run: go test -short -timeout 30s ./test/soak/
