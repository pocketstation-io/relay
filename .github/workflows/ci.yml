name: ci-go
on: [pull_request, push]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
