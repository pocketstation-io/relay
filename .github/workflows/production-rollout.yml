name: production-rollout

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ROTATE_AND_DEPLOY to rotate shared secrets and deploy both services
        required: true

permissions:
  contents: read

concurrency:
  group: pocketstation-production
  cancel-in-progress: false

jobs:
  rollout:
    if: inputs.confirmation == 'ROTATE_AND_DEPLOY'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Relay
        uses: actions/checkout@v4
        with:
          path: relay

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify deployment authority
        run: |
          set -euo pipefail
          flyctl status --app pocketstation-api --json >/dev/null
          flyctl status --app pocketstation-relay --json >/dev/null
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Stage coordinated production secrets
        run: |
          set -euo pipefail
          capability_secret="$(openssl rand -hex 32)"
          internal_secret="$(openssl rand -hex 32)"
          turn_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$capability_secret"
          echo "::add-mask::$internal_secret"
          echo "::add-mask::$turn_secret"
          flyctl secrets set --stage --app pocketstation-api \
            "POCKETSTATION_JWT_SECRET=$capability_secret" \
            "POCKETSTATION_INTERNAL_SECRET=$internal_secret"
          flyctl secrets set --stage --app pocketstation-relay \
            "POCKETSTATION_JWT_SECRET=$capability_secret" \
            "POCKETSTATION_INTERNAL_SECRET=$internal_secret" \
            "TURN_SHARED_SECRET=$turn_secret"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Apply coordinated secrets to current services
        run: |
          set -euo pipefail
          flyctl secrets deploy --app pocketstation-api
          flyctl secrets deploy --app pocketstation-relay
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy Relay
        working-directory: relay
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          flyctl deploy --remote-only --build-arg "GIT_SHA=$revision"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify live services
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 2 https://pocketstation-api.fly.dev/healthz
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 2 https://pocketstation-relay.fly.dev/healthz
